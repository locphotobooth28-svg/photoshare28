<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aide Décision Ponthévrard</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#20272d;background:#eef3f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh}.head{background:#fff;padding:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid #dce3e8}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;color:#68747c;margin-top:3px}.gps{font-weight:850;color:#155c89;margin-top:9px}.nav{display:flex;gap:8px;overflow-x:auto;padding:8px;background:#fff;position:sticky;top:92px;z-index:4;border-bottom:1px solid #dce3e8}.nav button{border:0;border-radius:14px;padding:12px 15px;font-weight:850;white-space:nowrap;background:#eaf0f3}.nav button.on{background:#20272d;color:#fff}.main{padding:16px}.title{font-size:25px;font-weight:900;margin:3px 0 14px}.card{background:#fff;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 2px 12px #00000008;white-space:pre-line;line-height:1.5}.warn{background:#fff5d8}.red{background:#ffeaea}.orange{background:#fff0d8}.blue{background:#e9f4ff}.green{background:#eaf8ec}.label{font-weight:850;font-size:13px;margin:14px 0 6px}select,input{width:100%;padding:13px;border:1px solid #cfd8df;border-radius:12px;background:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;background:#20272d;color:#fff;font-size:16px;font-weight:900}.bluebtn{background:#17628f}.tiny{font-size:12px;color:#66737c}.foot{text-align:center;font-size:11px;color:#6c7880;padding:12px 18px 28px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg label{position:relative}.seg input{position:absolute;opacity:0;pointer-events:none}.seg span{display:block;text-align:center;padding:13px 8px;border:2px solid #d6dee4;border-radius:13px;background:#fff;font-weight:900}.seg input:checked+span{background:#20272d;color:#fff;border-color:#20272d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.approach{border-left:5px solid #f0a000}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f5;font-size:12px;font-weight:800;margin-right:5px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><div class="head"><div class="brand">AIDE DÉCISION PONTHÉVRARD</div><div class="sub">Version web de test • Urgence • Travaux • Hivernal • Quiz</div><div class="gps" id="gps">📍 Localisation en attente…</div></div><div class="nav"><button class="on" data-v="home">Accueil</button><button data-v="urg">🚨 Urgence</button><button data-v="trav">🚧 Travaux</button><button data-v="vh">❄️ Hivernal</button><button data-v="quiz">🎓 Quiz</button></div><div class="main" id="main"></div><div class="foot">Prototype d'aide à la décision — les procédures opérationnelles à jour restent prioritaires.</div></div>
<script>
const main=document.getElementById('main'),gpsEl=document.getElementById('gps');let commune='Localisation…',codeCommune='',pr='PR à calculer',sens='Sens à détecter',acc='—',lat=null,lon=null,sourceCommune='—',qi=0;
const quiz=[{q:'Véhicule arrêté sur BAU : signalisation lumineuse ?',c:['FLU + feux bleus','Feux bleus + défilante, sans FLU','Gyro orange seul'],a:1,e:'Consigne actuelle enregistrée : feux bleus + défilante, sans FLU.'},{q:'En zone d’ombre, la FLU ?',c:['Recommandée','Bloquée / interdite','Sans changement'],a:1,e:'La logique doit empêcher la FLU en zone d’ombre.'}];
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,aa=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(aa))}
async function findCommune(la,lo){sourceCommune='API découpage administratif';try{const u=`https://geo.api.gouv.fr/communes?lat=${encodeURIComponent(la)}&lon=${encodeURIComponent(lo)}&fields=nom,code&format=json`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(Array.isArray(j)&&j.length){commune=j[0].nom||'Commune inconnue';codeCommune=j[0].code||'';return true}}catch(e){console.warn('Commune API',e)}if(km(la,lo,48.552222,1.910833)<=1.8){commune='Ponthévrard';codeCommune='78499';sourceCommune='Secours local Ponthévrard';return true}commune='Commune non trouvée';codeCommune='';sourceCommune='Échec API';return false}
function pos(){return `📍 A10 • Commune : ${commune}${codeCommune?' ('+codeCommune+')':''}\nPR GPS estimé : ${pr}\n${sens}\nPrécision GPS : ${acc}\n🌑 Zone d’ombre : à calculer\n🅿️ Accès sécurisé proche : à calculer\n📞 PAU proche : à calculer`}
function view(){return document.querySelector('.nav button.on')?.dataset.v||'home'}
async function applyPosition(p){lat=p.coords.latitude;lon=p.coords.longitude;acc='±'+Math.round(p.coords.accuracy)+' m';gpsEl.textContent='📍 GPS reçu • recherche commune…';await findCommune(lat,lon);gpsEl.textContent=`📍 ${commune} • GPS ${acc}`;show(view())}
function locate(){if(!navigator.geolocation){gpsEl.textContent='📍 GPS non disponible';return}gpsEl.textContent='📍 Recherche GPS…';navigator.geolocation.getCurrentPosition(applyPosition,e=>{gpsEl.textContent='📍 GPS refusé ou indisponible';commune='GPS non autorisé';show(view())},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function parsePR(v){const s=(v||'').trim().replace(',','.');let m=s.match(/^(\d+)\s*\+\s*(\d{1,3})$/);if(m)return Number(m[1])*1000+Number(m[2]);m=s.match(/^(\d+(?:\.\d+)?)$/);if(m)return Math.round(Number(m[1])*1000);return NaN}
function fmtPR(m){m=Math.round(m);if(m<0)return 'PR invalide';const km=Math.floor(m/1000),r=m%1000;return km+'+'+String(r).padStart(3,'0')}
function upstream(base,dist,s){return s==='S1'?base-dist:base+dist}
function downstream(base,dist,s){return s==='S1'?base+dist:base-dist}
function home(){main.innerHTML=`<div class="title">Aide à la décision</div><div class="card">${pos()}</div><button class="btn bluebtn" id="loc">Actualiser ma position GPS</button><div class="card warn"><b>Diagnostic localisation</b>\nSource commune : ${sourceCommune}\nCoordonnées GPS : ${lat===null?'—':lat.toFixed(6)+', '+lon.toFixed(6)}\n\nLa commune est recherchée via l’API officielle de découpage administratif.</div><div class="card red"><b>🚨 URGENCE</b>\nPosition • planche • scénario lumineux • zone d’ombre</div><div class="card orange"><b>🚧 TRAVAUX</b>\nNombre de voies • zone chantier • calcul des panneaux d’approche</div><div class="card blue"><b>❄️ HIVERNAL</b>\nObservations terrain • compte-rendu SPCE</div><div class="card green"><b>🎓 QUIZ & SOLUTIONS</b>\nQuestions + correction + source</div>`;document.getElementById('loc').onclick=locate}
function urg(){main.innerHTML=`<div class="title">🚨 Urgence</div><div class="card">${pos()}</div><div class="label">Situation</div><select id="evt"><option>Véhicule arrêté</option><option>Accident / incident</option><option>Objet / obstacle</option><option>Bouchon</option><option>TMD</option><option>Piéton</option><option>Animal errant</option></select><div class="label">Emplacement</div><select id="lane"><option>BAU / accotement</option><option>Voie de droite</option><option>Voie médiane</option><option>Voie de gauche</option><option>Bretelle</option></select><div class="label">Section</div><select id="lanes"><option>2 voies</option><option>3 voies</option><option>4 voies</option></select><button class="btn" id="go">Analyser la situation</button><div class="card" id="res">Le résultat apparaîtra ici.</div>`;document.getElementById('go').onclick=()=>{const e=evt.value,l=lane.value;let s=`📍 ${commune} • ${pr}\n\n💡 SCÉNARIO LUMINEUX\n`;if(e==='Véhicule arrêté'&&l.startsWith('BAU'))s+='🔵 Feux bleus : OUI\n↔️ Défilante : OUI\n❌ FLU : NON';else if(e==='Accident / incident')s+='PMV : ACCIDENT / RALENTIR\nFLU : selon configuration autorisée';else if(e==='Bouchon')s+='PMV : BOUCHON / RALENTIR';else s+='PMV : DANGER / RALENTIR\nFLU : selon configuration autorisée';s+='\n\n📘 Planche : moteur de correspondance en cours de branchement.';res.textContent=s}}
function trav(){main.innerHTML=`<div class="title">🚧 Travaux</div><div class="card">${pos()}</div><div class="label">Nombre de voies de la section</div><div class="seg"><label><input type="radio" name="nv" value="2" checked><span>2 voies</span></label><label><input type="radio" name="nv" value="3"><span>3 voies</span></label><label><input type="radio" name="nv" value="4"><span>4 voies</span></label></div><div class="grid2"><div><div class="label">Sens</div><select id="ws"><option value="S1">S1 — Paris → Province</option><option value="S2">S2 — Province → Paris</option></select></div><div><div class="label">Vitesse permanente</div><select id="speed"><option>130</option><option>110</option><option>90</option></select></div></div><div class="label">Type de neutralisation</div><select id="wt"><option value="vd">Voie de droite</option><option value="vg">Voie de gauche</option><option value="two">2 voies neutralisées</option><option value="bau">BAU seule</option><option value="basc">Basculement / chicane</option><option value="br">Bretelle</option></select><div class="label">PR début du biseau / neutralisation</div><input id="pstart" inputmode="decimal" placeholder="Ex : 24+370"><div class="tiny">Le calcul des panneaux d’approche est référencé au début du biseau, comme dans les planches. Tu peux saisir 24+370 ou 24.370.</div><div class="label">PR fin de zone travaux (optionnel)</div><input id="pend" inputmode="decimal" placeholder="Ex : 27+100"><button class="btn" id="tb">Calculer l’approche</button><div class="card approach" id="tr">Choisis 2, 3 ou 4 voies, le sens et saisis le PR du début du biseau.</div><div class="card warn"><b>⚠️ Base documentaire</b>\nLe calcul ci-dessous reprend la logique générale 2022 et les planches Travaux 2023. Dès que tu me fournis une Généralités plus récente, on revalide les valeurs et scénarios.</div>`;
document.getElementById('tb').onclick=()=>{const nv=Number(document.querySelector('input[name=nv]:checked').value),s=ws.value,type=wt.value,base=parsePR(pstart.value),end=parsePR(pend.value);if(!Number.isFinite(base)){tr.textContent='❌ PR de début invalide. Exemple attendu : 24+370';return}let out=`🛣️ A10 • ${nv} voies • ${s}\n📘 Famille de planches : T${nv}\n📍 Début du biseau : ${fmtPR(base)}\n\n`;if(type==='bau'){out+='BAU seule : la séquence générique de réduction du nombre de voies (800/600/400/200 m) ne doit pas être appliquée automatiquement.\n➡️ Utiliser la planche BAU correspondante.';tr.textContent=out;return}if(type==='br'){out+='Bretelle : le positionnement dépend de la planche entrée/sortie.\n➡️ Calcul générique bloqué pour éviter une fausse implantation.';tr.textContent=out;return}out+='📐 PANNEAUX D’APPROCHE — REPÈRES PR\n';out+=`• ${fmtPR(upstream(base,800,s))} — 800 m : AK5 ou AK14 selon la planche\n`;out+=`• ${fmtPR(upstream(base,600,s))} — 600 m : KD10 + panonceau de distance\n`;out+=`• ${fmtPR(upstream(base,400,s))} — 400 m : B14 + interdiction de dépasser selon planche\n`;out+=`• ${fmtPR(upstream(base,200,s))} — 200 m : KD10 + panonceau de distance + B14\n`;out+=`• ${fmtPR(base)} — début du biseau / neutralisation\n`;if(type==='two'){out+='\n⚠️ Réduction de plus d’une voie : la réduction doit être décomposée par unités. Le biseau suivant doit être annoncé et il faut conserver au moins 400 m d’alignement entre deux biseaux.'}if(type==='basc'){out+='\n⚠️ Basculement/chicane : ces PR d’approche sont des repères généraux ; les distances propres au basculement restent celles de la planche sélectionnée.'}if(Number.isFinite(end)){const len=s==='S1'?end-base:base-end;if(len>0){out+=`\n\n📏 Longueur de zone saisie : ${(len/1000).toFixed(2)} km`;if(len>=2000){out+='\n🔁 Rappels de prescription : environ tous les 2 km au droit du chantier.';for(let d=2000;d<len;d+=2000)out+=`\n   • repère ≈ ${fmtPR(downstream(base,d,s))}`}}else out+='\n\n⚠️ Le PR de fin n’est pas cohérent avec le sens choisi.'}out+=`\n\n🚦 Vitesse permanente saisie : ${speed.value} km/h. Les valeurs exactes des B14 seront liées à la planche et à la Généralités à jour.`;tr.textContent=out}}
function vh(){main.innerHTML=`<div class="title">❄️ Viabilité hivernale</div><div class="card">${pos()}</div><div class="label">Température chaussée / terrain</div><input id="temp" type="number" step="0.1" placeholder="0"><label class="card"><input type="checkbox" id="wet"> Chaussée humide / mouillée</label><label class="card"><input type="checkbox" id="snow"> Neige</label><button class="btn" id="vb">Analyser</button><div class="card" id="vr">L’analyse apparaîtra ici.</div>`;vb.onclick=()=>{const t=parseFloat(temp.value);let s=Number.isFinite(t)&&t<=0&&wet.checked?'⚠️ Risque de glissance/verglas à signaler au SPCE.':'ℹ️ Poursuivre observation et transmission terrain.';if(snow.checked)s+='\n❄️ Neige : raclage mécanique indispensable.';vr.textContent=s}}
function quizView(){const o=quiz[qi];main.innerHTML=`<div class="title">🎓 Quiz & solutions</div><div class="card"><b>Question ${qi+1}/${quiz.length}</b>\n\n${o.q}</div>${o.c.map((x,i)=>`<label class="card"><input type="radio" name="q" value="${i}"> ${x}</label>`).join('')}<button class="btn" id="qb">Vérifier</button><div class="card green" id="qs" style="display:none"></div>`;qb.onclick=()=>{const x=document.querySelector('input[name=q]:checked');if(!x)return;qs.style.display='block';qs.textContent=(+x.value===o.a?'✅ Bonne réponse':'❌ Mauvaise réponse')+'\n\nSolution : '+o.c[o.a]+'\n'+o.e;qi=(qi+1)%quiz.length}}
function show(v){if(v==='home')home();else if(v==='urg')urg();else if(v==='trav')trav();else if(v==='vh')vh();else quizView()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.dataset.v)});home();locate();
</script>
</body>
</html>
