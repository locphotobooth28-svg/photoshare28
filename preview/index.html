<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aide Décision Ponthévrard</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#20272d;background:#eef3f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh}.head{background:#fff;padding:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid #dce3e8}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;color:#68747c;margin-top:3px}.gps{font-weight:850;color:#155c89;margin-top:9px}.nav{display:flex;gap:8px;overflow-x:auto;padding:8px;background:#fff;position:sticky;top:92px;z-index:4;border-bottom:1px solid #dce3e8}.nav button{border:0;border-radius:14px;padding:12px 15px;font-weight:850;white-space:nowrap;background:#eaf0f3}.nav button.on{background:#20272d;color:#fff}.main{padding:16px}.title{font-size:25px;font-weight:900;margin:3px 0 14px}.card{background:#fff;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 2px 12px #00000008;white-space:pre-line;line-height:1.5}.warn{background:#fff5d8}.red{background:#ffeaea}.orange{background:#fff0d8}.blue{background:#e9f4ff}.green{background:#eaf8ec}.label{font-weight:850;font-size:13px;margin:14px 0 6px}select,input{width:100%;padding:13px;border:1px solid #cfd8df;border-radius:12px;background:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:10px;background:#20272d;color:#fff;font-size:16px;font-weight:900}.bluebtn{background:#17628f}.tiny{font-size:12px;color:#66737c}.foot{text-align:center;font-size:11px;color:#6c7880;padding:12px 18px 28px}</style></head><body><div class="app"><div class="head"><div class="brand">AIDE DÉCISION PONTHÉVRARD</div><div class="sub">Version web de test • Urgence • Travaux • Hivernal • Quiz</div><div class="gps" id="gps">📍 Localisation en attente…</div></div><div class="nav"><button class="on" data-v="home">Accueil</button><button data-v="urg">🚨 Urgence</button><button data-v="trav">🚧 Travaux</button><button data-v="vh">❄️ Hivernal</button><button data-v="quiz">🎓 Quiz</button></div><div class="main" id="main"></div><div class="foot">Prototype d'aide à la décision — les procédures opérationnelles à jour restent prioritaires.</div></div><script>
const main=document.getElementById('main'),gpsEl=document.getElementById('gps');let commune='Localisation…',codeCommune='',pr='PR à calculer',sens='Sens à détecter',acc='—',lat=null,lon=null,sourceCommune='—',qi=0;
const quiz=[{q:'Véhicule arrêté sur BAU : signalisation lumineuse ?',c:['FLU + feux bleus','Feux bleus + défilante, sans FLU','Gyro orange seul'],a:1,e:'Consigne actuelle enregistrée : feux bleus + défilante, sans FLU.'},{q:'En zone d’ombre, la FLU ?',c:['Recommandée','Bloquée / interdite','Sans changement'],a:1,e:'La logique doit empêcher la FLU en zone d’ombre.'}];
function km(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,aa=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(aa))}
async function findCommune(la,lo){sourceCommune='API découpage administratif';try{const u=`https://geo.api.gouv.fr/communes?lat=${encodeURIComponent(la)}&lon=${encodeURIComponent(lo)}&fields=nom,code&format=json`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(Array.isArray(j)&&j.length){commune=j[0].nom||'Commune inconnue';codeCommune=j[0].code||'';return true}}catch(e){console.warn('Commune API',e)}
// secours local uniquement si l'API publique est indisponible : centre de Ponthévrard, rayon prudent
if(km(la,lo,48.552222,1.910833)<=1.8){commune='Ponthévrard';codeCommune='78499';sourceCommune='Secours local Ponthévrard';return true}
commune='Commune non trouvée';codeCommune='';sourceCommune='Échec API';return false}
function pos(){return `📍 A10 • Commune : ${commune}${codeCommune?' ('+codeCommune+')':''}\nPR GPS estimé : ${pr}\n${sens}\nPrécision GPS : ${acc}\n🌑 Zone d’ombre : à calculer\n🅿️ Accès sécurisé proche : à calculer\n📞 PAU proche : à calculer`}
function view(){return document.querySelector('.nav button.on')?.dataset.v||'home'}
async function applyPosition(p){lat=p.coords.latitude;lon=p.coords.longitude;acc='±'+Math.round(p.coords.accuracy)+' m';gpsEl.textContent='📍 GPS reçu • recherche commune…';await findCommune(lat,lon);gpsEl.textContent=`📍 ${commune} • GPS ${acc}`;show(view())}
function locate(){if(!navigator.geolocation){gpsEl.textContent='📍 GPS non disponible';return}gpsEl.textContent='📍 Recherche GPS…';navigator.geolocation.getCurrentPosition(applyPosition,e=>{gpsEl.textContent='📍 GPS refusé ou indisponible';commune='GPS non autorisé';show(view())},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function home(){main.innerHTML=`<div class="title">Aide à la décision</div><div class="card">${pos()}</div><button class="btn bluebtn" id="loc">Actualiser ma position GPS</button><div class="card warn"><b>Diagnostic localisation</b>\nSource commune : ${sourceCommune}\nCoordonnées GPS : ${lat===null?'—':lat.toFixed(6)+', '+lon.toFixed(6)}\n\nLa commune est maintenant recherchée via l’API officielle de découpage administratif. Un secours local Ponthévrard n'est utilisé que si cette API est indisponible.</div><div class="card red"><b>🚨 URGENCE</b>\nPosition • planche • scénario lumineux • zone d’ombre</div><div class="card orange"><b>🚧 TRAVAUX</b>\nRecherche de planche et configuration</div><div class="card blue"><b>❄️ HIVERNAL</b>\nObservations terrain • compte-rendu SPCE</div><div class="card green"><b>🎓 QUIZ & SOLUTIONS</b>\nQuestions + correction + source</div>`;document.getElementById('loc').onclick=locate}
function urg(){main.innerHTML=`<div class="title">🚨 Urgence</div><div class="card">${pos()}</div><div class="label">Situation</div><select id="evt"><option>Véhicule arrêté</option><option>Accident / incident</option><option>Objet / obstacle</option><option>Bouchon</option><option>TMD</option><option>Piéton</option><option>Animal errant</option></select><div class="label">Emplacement</div><select id="lane"><option>BAU / accotement</option><option>Voie de droite</option><option>Voie médiane</option><option>Voie de gauche</option><option>Bretelle</option></select><div class="label">Section</div><select id="lanes"><option>2 voies</option><option>3 voies</option><option>4 voies</option></select><button class="btn" id="go">Analyser la situation</button><div class="card" id="res">Le résultat apparaîtra ici.</div>`;document.getElementById('go').onclick=()=>{const e=evt.value,l=lane.value;let s=`📍 ${commune} • ${pr}\n\n💡 SCÉNARIO LUMINEUX\n`;if(e==='Véhicule arrêté'&&l.startsWith('BAU'))s+='🔵 Feux bleus : OUI\n↔️ Défilante : OUI\n❌ FLU : NON';else if(e==='Accident / incident')s+='PMV : ACCIDENT / RALENTIR\nFLU : selon configuration autorisée';else if(e==='Bouchon')s+='PMV : BOUCHON / RALENTIR';else s+='PMV : DANGER / RALENTIR\nFLU : selon configuration autorisée';s+='\n\n📘 Planche : moteur de correspondance en cours de branchement.';res.textContent=s}}
function trav(){main.innerHTML=`<div class="title">🚧 Travaux</div><div class="card">${pos()}</div><div class="label">Configuration</div><input id="tq" placeholder="Ex : 2 voies, voie droite, bretelle"><button class="btn" id="tb">Rechercher</button><div class="card" id="tr">BAU, voie droite, voie gauche, VSVL, basculement, fermeture, bretelle, FLR…</div>`;tb.onclick=()=>tr.textContent=`Recherche : ${tq.value||'—'}\n\nLa correspondance T2/T3/T4/TP/TA/TS sera affichée ici.`}
function vh(){main.innerHTML=`<div class="title">❄️ Viabilité hivernale</div><div class="card">${pos()}</div><div class="label">Température chaussée / terrain</div><input id="temp" type="number" step="0.1" placeholder="0"><label class="card"><input type="checkbox" id="wet"> Chaussée humide / mouillée</label><label class="card"><input type="checkbox" id="snow"> Neige</label><button class="btn" id="vb">Analyser</button><div class="card" id="vr">L’analyse apparaîtra ici.</div>`;vb.onclick=()=>{const t=parseFloat(temp.value);let s=Number.isFinite(t)&&t<=0&&wet.checked?'⚠️ Risque de glissance/verglas à signaler au SPCE.':'ℹ️ Poursuivre observation et transmission terrain.';if(snow.checked)s+='\n❄️ Neige : raclage mécanique indispensable.';vr.textContent=s}}
function quizView(){const o=quiz[qi];main.innerHTML=`<div class="title">🎓 Quiz & solutions</div><div class="card"><b>Question ${qi+1}/${quiz.length}</b>\n\n${o.q}</div>${o.c.map((x,i)=>`<label class="card"><input type="radio" name="q" value="${i}"> ${x}</label>`).join('')}<button class="btn" id="qb">Vérifier</button><div class="card green" id="qs" style="display:none"></div>`;qb.onclick=()=>{const x=document.querySelector('input[name=q]:checked');if(!x)return;qs.style.display='block';qs.textContent=(+x.value===o.a?'✅ Bonne réponse':'❌ Mauvaise réponse')+'\n\nSolution : '+o.c[o.a]+'\n'+o.e;qi=(qi+1)%quiz.length}}
function show(v){if(v==='home')home();else if(v==='urg')urg();else if(v==='trav')trav();else if(v==='vh')vh();else quizView()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.dataset.v)});home();locate();
</script></body></html>
