<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aide Décision Ponthévrard — Preview</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1d252b;background:#eef2f5}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh}.head{background:#fff;padding:18px 18px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid #dde3e8}.brand{font-weight:900;font-size:20px}.sub{font-size:12px;color:#64707a;margin-top:3px}.gps{font-weight:800;color:#0f4d7b;margin-top:8px;font-size:13px}.nav{display:flex;overflow-x:auto;gap:8px;background:#fff;padding:8px;position:sticky;top:84px;z-index:4;border-bottom:1px solid #dde3e8}.nav button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;white-space:nowrap;background:#edf1f4}.nav button.on{background:#1d252b;color:#fff}.main{padding:16px 16px 36px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #0000000a;white-space:pre-line;line-height:1.45}.red{background:#ffeded}.orange{background:#fff3df}.blue{background:#eaf4ff}.green{background:#edf8ee}.warn{background:#fff6df}.title{font-size:24px;font-weight:900;margin:2px 0 14px}.label{font-size:13px;font-weight:900;margin:14px 0 6px}select,input{width:100%;font-size:15px;padding:12px;border:1px solid #d5dce2;border-radius:12px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:13px;margin-top:10px;background:#1d252b;color:#fff;font-weight:900;font-size:15px}.btn.bluebtn{background:#0f4d7b}.result{font-size:14px}.choice{display:block;background:#fff;padding:12px;border:1px solid #d6dde3;border-radius:12px;margin:8px 0}.foot{text-align:center;color:#6c767e;font-size:11px;padding:8px 18px 24px}@media(max-width:520px){.nav{top:88px}.brand{font-size:18px}}
</style></head><body><div class="app"><div class="head"><div class="brand">AIDE DÉCISION PONTHÉVRARD</div><div class="sub">Preview web V0.1 • Urgence • Travaux • Hivernal • Quiz</div><div class="gps" id="gps">📍 Mode démo — PR 24+370 • S1 • ±6 m</div></div><div class="nav"><button class="on" data-v="home">Accueil</button><button data-v="urg">🚨 Urgence</button><button data-v="trav">🚧 Travaux</button><button data-v="vh">❄️ Hivernal</button><button data-v="quiz">🎓 Quiz</button></div><div class="main" id="main"></div><div class="foot">Prototype de visualisation — les procédures et consignes opérationnelles à jour restent prioritaires.</div></div><script>
const main=document.getElementById('main');let pr='24+370',sens='S1',commune='Ablis',acc='±6 m';let qi=0;
const q=[{q:'Véhicule arrêté sur BAU : quelle signalisation lumineuse utiliser selon la consigne actuelle enregistrée ?',c:['FLU + feux bleus','Feux bleus + défilante, sans FLU','Gyro orange seul'],a:1,e:'Consigne terrain actuelle : pas de FLU pour un véhicule arrêté sur BAU ; feux bleus + défilante.'},{q:'En zone d’ombre, que fait l’outil avec la FLU ?',c:['Il la recommande','Il la désactive et signale l’interdiction','Il ne change rien'],a:1,e:'La logique bloque la FLU lorsque la situation est identifiée en zone d’ombre.'}];
function pos(){return `📍 A10 • Commune : ${commune}\nPR GPS estimé : ${pr}\n${sens==='S1'?'S1 — Paris → Province':'S2 — Province → Paris'}\nPrécision GPS : ${acc}\n🌑 Zone d’ombre : NON\n🅿️ Accès sécurisé proche : démonstration\n📞 PAU proche : démonstration`}
function home(){main.innerHTML=`<div class="title">Aide à la décision</div><div class="card">${pos()}</div><button class="btn bluebtn" id="gpsbtn">Tester ma position GPS</button><div class="card warn">⚠️ Cette page est une preview visuelle. Le calcul PR complet et les données Ponthévrard sont dans le projet Android V0.1 et seront intégrés à la version web finale.</div><div class="card red"><b>🚨 URGENCE</b>\nPosition • planche • scénario lumineux • zone d’ombre</div><div class="card orange"><b>🚧 TRAVAUX</b>\nRecherche de planche et configuration</div><div class="card blue"><b>❄️ HIVERNAL</b>\nObservations terrain • aide au compte-rendu SPCE</div><div class="card green"><b>🎓 QUIZ & SOLUTIONS</b>\nQuestions + correction + source</div>`;document.getElementById('gpsbtn').onclick=testGps}
function urg(){main.innerHTML=`<div class="title">🚨 Urgence</div><div class="card">${pos()}</div><div class="label">Situation</div><select id="evt"><option>Véhicule arrêté</option><option>Accident / incident</option><option>Objet / obstacle</option><option>Bouchon</option><option>TMD</option><option>Piéton</option><option>Animal errant</option></select><div class="label">Emplacement</div><select id="lane"><option>BAU / accotement</option><option>Voie de droite</option><option>Voie médiane</option><option>Voie de gauche</option><option>Bretelle</option></select><div class="label">Section</div><select id="lanes"><option>2 voies</option><option>3 voies</option><option>4 voies</option></select><div class="label">Durée prévisible</div><select id="dur"><option>Quelques minutes</option><option>≤ 2 h</option><option>2 à 24 h</option><option>> 24 h</option></select><button class="btn" id="analyse">ANALYSER LA SITUATION</button><div class="card result" id="res">Le résultat apparaîtra ici.</div>`;document.getElementById('analyse').onclick=()=>{let e=evt.value,l=lane.value,d=dur.value,s=`📍 ${pr} • ${sens}\n\n💡 SCÉNARIO LUMINEUX\n`;if(e==='Véhicule arrêté'&&l.startsWith('BAU'))s+='🔵 Feux bleus : OUI\n↔️ Défilante : OUI\n❌ FLU : NON\n';else if(e==='Accident / incident')s+='PMV : ACCIDENT / RALENTIR\nFLU : selon configuration autorisée\n';else if(e==='Bouchon')s+='PMV : BOUCHON / RALENTIR\nFLU : —\n';else s+='PMV : DANGER / RALENTIR\nFLU : selon configuration autorisée\n';s+='\n📘 Planche suggérée : moteur de correspondance à finaliser avec la Généralités à jour.';if(d==='2 à 24 h'||d==='> 24 h')s+='\n\n⏱️ Vérifier passage à une signalisation complète / logique travaux.';res.textContent=s}}
function trav(){main.innerHTML=`<div class="title">🚧 Travaux</div><div class="card">${pos()}</div><div class="label">Configuration recherchée</div><input id="tq" placeholder="Ex : 2 voies voie droite bretelle"><button class="btn" id="tb">RECHERCHER LA PLANCHE</button><div class="card result" id="tr">Exemples disponibles dans le moteur Android : BAU, voie droite, voie gauche, VSVL, basculement, fermeture, bretelle, FLR…</div>`;tb.onclick=()=>tr.textContent=`Recherche : ${tq.value||'—'}\n\nPreview : la V1 affichera ici la ou les planches T2/T3/T4/TP/TA/TS avec les règles associées.`}
function vh(){main.innerHTML=`<div class="title">❄️ Viabilité hivernale</div><div class="card">${pos()}</div><div class="label">Température chaussée / terrain</div><input id="temp" type="number" step="0.1" placeholder="0"><label class="choice"><input type="checkbox" id="wet"> Chaussée humide / mouillée</label><label class="choice"><input type="checkbox" id="snow"> Neige</label><label class="choice"><input type="checkbox" id="fog"> Brouillard / brume</label><button class="btn" id="vhb">ANALYSER LES OBSERVATIONS</button><div class="card result" id="vhr">L’analyse apparaîtra ici.</div>`;vhb.onclick=()=>{const t=parseFloat(temp.value),risk=Number.isFinite(t)&&t<=0&&(wet.checked||fog.checked);let s=risk?'⚠️ Risque de glissance / verglas à signaler au SPCE.':'ℹ️ Poursuivre observation et transmission terrain.';if(snow.checked)s+='\n❄️ Neige : rappeler le raclage mécanique et la priorité de la voie de droite pendant la chute.';s+='\n\n📡 AR : observe / analyse / rend compte. SPCE : déclenche le traitement.';vhr.textContent=s}}
function quiz(){const o=q[qi];main.innerHTML=`<div class="title">🎓 Quiz & solutions</div><div class="card"><b>Question ${qi+1}/${q.length}</b>\n\n${o.q}</div>${o.c.map((x,i)=>`<label class="choice"><input type="radio" name="q" value="${i}"> ${x}</label>`).join('')}<button class="btn" id="qb">Vérifier</button><div class="card green" id="qs" style="display:none"></div><button class="btn bluebtn" id="qn" style="display:none">Question suivante</button>`;qb.onclick=()=>{let x=document.querySelector('input[name=q]:checked');if(!x)return;qs.style.display='block';qs.textContent=(+x.value===o.a?'✅ Bonne réponse':'❌ Mauvaise réponse')+'\n\nSolution : '+o.c[o.a]+'\n\n'+o.e;qn.style.display='block'};qn.onclick=()=>{qi=(qi+1)%q.length;quiz()}}
function testGps(){if(!navigator.geolocation){alert('GPS non disponible dans ce navigateur');return}document.getElementById('gps').textContent='📍 Recherche de la position…';navigator.geolocation.getCurrentPosition(p=>{document.getElementById('gps').textContent=`📍 GPS reçu • ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} • ±${Math.round(p.coords.accuracy)} m`;alert('GPS reçu. La preview affiche les coordonnées ; la V1 utilisera la base Ponthévrard pour calculer le PR instantané.')},()=>{document.getElementById('gps').textContent='📍 GPS refusé ou indisponible — mode démo maintenu'})}
function show(v){if(v==='home')home();if(v==='urg')urg();if(v==='trav')trav();if(v==='vh')vh();if(v==='quiz')quiz()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.dataset.v)});home();
</script></body></html>
